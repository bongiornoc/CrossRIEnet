[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crienet"
version = "0.2.0"
description = "Neural cleaning of rectangular cross-correlations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Efstratios Manolakis"},
    {name = "Christian Bongiorno"},
    {name = "Rosario N. Mantegna"},
]
keywords = [
    "cross-correlation",
    "random-matrix-theory",
    "singular-value-decomposition",
    "tensorflow",
    "keras",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]
dependencies = [
    "tensorflow>=2.16.1",
    "keras>=3.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "coverage[toml]>=7.6",
    "mypy>=1.11",
    "numpydoc>=1.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "scipy>=1.10.0",
    "sphinx>=8.0",
    "twine>=6.0",
]

[project.urls]
"Homepage" = "https://github.com/bongiornoc/CrossRIEnet"
"Documentation" = "https://github.com/bongiornoc/CrossRIEnet/tree/main/docs"
"Bug Tracker" = "https://github.com/bongiornoc/CrossRIEnet/issues"
"Source" = "https://github.com/bongiornoc/CrossRIEnet"

[tool.setuptools.packages.find]
include = ["crienet*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["crienet"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
