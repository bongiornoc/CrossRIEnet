name: Tests

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            tensorflow: "2.16.1"
          - python: "3.11"
            tensorflow: "2.21.0"
          - python: "3.12"
            tensorflow: "2.21.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install tested TensorFlow and CRIENT
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tensorflow==${{ matrix.tensorflow }}" "keras>=3"
          python -m pip install --no-deps -e .
          python -m pip install pytest pytest-cov scipy
      - name: Run CPU tests
        run: pytest --cov=crient --cov-report=term-missing

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint and type check
        run: |
          ruff format --check .
          ruff check .
          mypy
      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Build local distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Installation smoke test
        run: |
          python -m venv /tmp/crient-smoke
          /tmp/crient-smoke/bin/python -m pip install dist/*.whl
          /tmp/crient-smoke/bin/python -c "from crient import CrossRIEnetLayer; print(CrossRIEnetLayer)"
